<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asik slicing</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="/assets/css/global.css" />
      <style>
    .font-times {

  <body class="font-Zelda">
    <!-- start navbar -->
    <header class="sticky top-0 z-[60]">
      <nav class="flex items-center justify-between bg-[#7A3D21] px-6 lg:px-[90px] h-[90px] border-b-[#4C1C0E] border-b-8">
        <!-- left side -->
        <div class="flex flex-row items-center gap-15">
          <img class="h-12 lg:h-14 w-auto" src="/assets/images/navbar-logo.svg" alt="Home" />
          <!-- lg screen only -->
          <ul class="text-[#C07E4E] text-[2rem] hidden lg:flex lg:flex-row gap-[4rem]">
            <a class="hover:text-[#F9DCB4]" href="">Home</a>
            <a class="text-[#F9DCB4] underline" href="">Tema</a>
            <a class="hover:text-[#F9DCB4]" href="">Materi</a>
            <a class="hover:text-[#F9DCB4]" href="">Asik</a>
          </ul>
        </div>
        <div class="flex flex-row items-center gap-3">
          <!-- right side -->
          <div class="hidden lg:flex lg:flex-row items-center gap-3">
            <!-- lg screen -->
            <img class="w-11" src="/assets/images/x-logo.svg" alt="X" />
            <img class="w-11" src="../assets/images/tiktok-logo.svg" alt="TikTok" />
            <img class="w-11" src="../assets/images/ig-logo.svg" alt="Instagram" />
            <img class="w-11" src="../assets/images/yt-logo.svg" alt="Youtube" />
          </div>
          <!-- sm screen -->
          <button id="hamburgerBtn" class="flex lg:hidden items-center justify-center w-[42px] h-[42px] bg-[#5C2E17] rounded-lg z-[60]">
            <img id="iconHamburger" src="/assets/images/menu.svg" alt="hamburger" class="h-[24px] w-[24px]" />
            <img id="iconClose" src="/assets/images/x.svg" alt="hamburger" class="h-[24px] w-[24px] hidden" />
          </button>
        </div>
      </nav>

      <!-- sm screen sidebar -->
      <div id="mobileMenu" class="lg:hidden bg-[#F3E5D0] text-3xl fixed inset-0 translate-x-full z-[50] transition-transform duration-250 ease-in-out">
        <div class="h-[90px] bg-[#743D21] flex items-center px-6">
          <img class="h-12 w-auto" src="/assets/images/navbar-logo.svg" alt="Home" />
        </div>

        <!-- nav texts -->
        <ul class="flex flex-col items-center text-center py-6">
          <li class="w-full text-[#C07E4E] py-5">
            <a class="" href="">Home</a>
          </li>
          <li class="w-full text-[#7A3D21] py-5">
            <a class="underline" href="">Tema</a>
          </li>
          <li class="w-full text-[#C07E4E] py-5">
            <a class="" href="">Materi</a>
          </li>
          <li class="w-full text-[#C07E4E] py-5">
            <a class="" href="">Asik</a>
          </li>
        </ul>

        <!-- icons -->
        <div class="flex flex-row items-center justify-center gap-4">
          <img class="w-11 text-[#C07E4E]" src="/assets/images/x-logo-dark.svg" alt="X" />
          <img class="w-11" src="../assets/images/tiktok-logo-dark.svg" alt="TikTok" />
          <img class="w-11" src="../assets/images/ig-logo-dark.svg" alt="Instagram" />
          <img class="w-11" src="../assets/images/yt-logo-dark.svg" alt="Youtube" />
        </div>
      </div>
    </header>
    <script src="/assets/js/mobileNav.js"></script>

    
    <main> 
      
      <!-- SECTION FAQ -->
      <section class="w-full min-h-screen 
                      bg-[url('../assets/images/BG.png')] md:bg-[url('../assets/images/bg-faq.svg')] 
                      bg-cover bg-top bg-no-repeat 
                      pt-16 md:pt-24 pb-20 px-4 md:px-10 flex flex-col items-center">
        <!-- Judul FAQ -->
        <h2 class="font-thin text-6xl md:text-8xl text-[#FFFFFF] uppercase tracking-wider text-center mb-8 md:mb-12
                  [text-shadow:0_3px_0_#7A3D21] md:[text-shadow:0_9px_0_#7A3D21] mt-36">
          FAQ
        </h2>
        <!-- List FAQ (Mobile: 340px, gap 16px | Desktop: 1260px, gap 32px) -->
        <div class="w-[340px] md:w-full md:max-w-[1260px] flex flex-col gap-4 md:gap-8 mx-auto">

          <!-- BOX  1 -->
          <div class="faq-item w-full">
            <div class="faq-header relative z-10 flex items-center justify-between cursor-pointer

                        bg-[#7A3D21] 
                        border-[6px] md:border-[8px] border-[#3A1709]
                        rounded-[20px] shadow-[0_6px_0_rgba(0,0,0,0.25)]">
              <span class="text-[#FFFFFF] font-times text-[24px] md:text-[48px] font-medium pr-2">
                Apa itu Simetri ?
              </span>
              <button type="button" aria-label="Buka jawaban"
                      class="w-10 h-10 md:w-[68px] md:h-[68px] bg-[#4A1D0E] rounded-xl flex items-center justify-center shrink-0">
                <img class="faq-icon w-5 h-5 md:w-8 md:h-8 transition-transform duration-300" src="../assets/images/Extend.png" alt="Arrow" />
              </button>
            </div>
            <div class="faq-content hidden -mt-6 md:-mt-10 mx-2 md:mx-6 pt-10 md:pt-16 pb-5 md:pb-8 px-4 md:px-[48px]
                        bg-[#B8764F] border-[4px] md:border-[6px] border-t-0 border-[#7A3D22]
                        rounded-b-[20px]">
              <p class="text-[#FFFFFF] font-times text-[20px] md:text-[36px] leading-snug md:leading-relaxed text-justify">
                Simetri adalahh....
              </p>
            </div>
          </div>

          <!-- BOX 2 -->
          <div class="faq-item w-full">
            <div class="faq-header relative z-10 flex items-center justify-between cursor-pointer
                        w-full h-[80px] md:h-[152px]
                        py-2 px-4 md:py-[24px] md:px-[48px]
                        bg-[#7A3D21] 
                        border-[6px] md:border-[8px] border-[#3A1709]
                        rounded-[20px] shadow-[0_6px_0_rgba(0,0,0,0.25)]">
              <span class="text-[#FFFFFF] font-times text-[24px] md:text-[48px] font-medium pr-2">
                Apa itu Simetri ?
              </span>
              <button type="button" aria-label="Buka jawaban"
                      class="w-10 h-10 md:w-[68px] md:h-[68px] bg-[#4A1D0E] rounded-xl flex items-center justify-center shrink-0">
                <img class="faq-icon w-5 h-5 md:w-8 md:h-8 transition-transform duration-300" src="../assets/images/Extend.png" alt="Arrow" />
              </button>
            </div>
            <div class="faq-content hidden -mt-6 md:-mt-10 mx-2 md:mx-6 pt-10 md:pt-16 pb-5 md:pb-8 px-4 md:px-[48px]
                        bg-[#B8764F] border-[4px] md:border-[6px] border-t-0 border-[#7A3D22]
                        rounded-b-[20px]">
              <p class="text-[#FFFFFF] font-times text-[20px] md:text-[36px] leading-snug md:leading-relaxed text-justify">
                Simetri adalahh....
              </p>
            </div>
          </div>

          <!-- BOX ITEM 3 -->
          <div class="faq-item w-full">
            <div class="faq-header relative z-10 flex items-center justify-between cursor-pointer
                        w-full h-[80px] md:h-[152px]
                        py-2 px-4 md:py-[24px] md:px-[48px]
                        bg-[#7A3D21] 
                        border-[6px] md:border-[8px] border-[#3A1709]
                        rounded-[20px] shadow-[0_6px_0_rgba(0,0,0,0.25)]">
              <span class="text-[#FFFFFF] font-times text-[24px] md:text-[48px] font-medium pr-2">
                Apa itu Simetri ?
              </span>
              <button type="button" aria-label="Buka jawaban"
                      class="w-10 h-10 md:w-[68px] md:h-[68px] bg-[#4A1D0E] rounded-xl flex items-center justify-center shrink-0">
                <img class="faq-icon w-5 h-5 md:w-8 md:h-8 transition-transform duration-300" src="../assets/images/Extend.png" alt="Arrow" />
              </button>
            </div>
            <div class="faq-content hidden -mt-6 md:-mt-10 mx-2 md:mx-6 pt-10 md:pt-16 pb-5 md:pb-8 px-4 md:px-[48px]
                        bg-[#B8764F] border-[4px] md:border-[6px] border-t-0 border-[#7A3D22]
                        rounded-b-[20px]">
              <p class="text-[#FFFFFF] font-times text-[20px] md:text-[36px] leading-snug md:leading-relaxed text-justify">
                Simetri adalahh....
              </p>
            </div>
          </div>

        </div>
            </div>
      </section>
    </main>

    <style>
      .faq-item.is-open .faq-header { transform: scale(1.025); }
      .faq-header { transition: transform .2s ease; }
    </style>

    <script>
      document.querySelectorAll('.faq-item').forEach(item => {
        item.querySelector('.faq-header').addEventListener('click', () => {
          const content = item.querySelector('.faq-content');
          const icon = item.querySelector('.faq-icon');
          const open = item.classList.toggle('is-open');
          content.classList.toggle('hidden', !open);
          icon.classList.toggle('rotate-180', open);
        });
      });
    </script>

  </body>
</html>
